function useStorage(key, init) {
const [val, setVal] = React.useState(() => {
try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
});
React.useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [val]);
return [val, setVal];
}

function App() {
const [done, setDone] = useStorage(“wss_done”, []);
const [lesson, setLesson] = React.useState(null);
const [video, setVideo] = React.useState(null);
const toggle = (w) => setDone(p => p.includes(w) ? p.filter(x=>x!==w) : […p, w]);
const open = (l) => { setLesson(l); setVideo(l.videos[0]||null); window.scrollTo(0,0); };
const pct = Math.round((done.length/60)*100);
if (lesson) return <LessonView lesson={lesson} video={video} setVideo={setVideo} onBack={()=>setLesson(null)} done={done} toggle={toggle} open={open} pct={pct}/>;
return (
<div style={{minHeight:“100vh”,background:”#111”}}>
<Header done={done} pct={pct}/>
<div style={{maxWidth:1100,margin:“0 auto”,padding:“32px 20px 80px”}}>
{COURSE.years.map((y,i) => <YearBlock key={i} year={y} done={done} open={open}/>)}
<Resources/>
</div>
</div>
);
}
